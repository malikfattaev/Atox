# Каждый коммит в main с изменениями приложения выпускается релизом на GitHub:
# установленный Atox находит его и предлагает обновиться.
name: Release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

# Релизы выходят строго по очереди, в порядке коммитов.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  # Версия — major.minor из package.json и номер сборки: 0.1.42. Общая для всех платформ.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Обе архитектуры собираются на Intel: машин macOS на Apple Silicon у GitHub часто не
          # хватает, и сборка часами стоит в очереди. Готовые node-pty есть под обе архитектуры.
          - platform: mac
            runner: macos-15-intel
            builder: --mac --arm64 --x64
            files: |
              app/dist/*.dmg
              app/dist/*.zip
              app/dist/latest-mac.json
          - platform: linux
            runner: ubuntu-24.04
            builder: --linux --x64
            files: |
              app/dist/*.AppImage
              app/dist/*.pacman
              app/dist/latest-linux.json
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Пакет pacman собирается через bsdtar.
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # На Linux node-pty собирается из исходников: готовых сборок под него в пакете нет.
      - run: npm ci

      # Mac собирается на Intel-раннере, а бинарь claude под darwin-arm64 npm на Intel не ставит
      # (optional dep под другую архитектуру). Доставляем оба руками, иначе arm64-сборка выйдет
      # без бандла — именно так ломались релизы 0.2.108 и 0.2.109.
      - if: matrix.platform == 'mac'
        run: |
          set -eu
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/@anthropic-ai/claude-agent-sdk/package.json','utf8')).version)")
          npm install --no-save --no-package-lock --force \
            --os=darwin --cpu=arm64 "@anthropic-ai/claude-agent-sdk-darwin-arm64@$VER"
          npm install --no-save --no-package-lock --force \
            --os=darwin --cpu=x64 "@anthropic-ai/claude-agent-sdk-darwin-x64@$VER"
          test -x node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude
          test -x node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/claude

      - run: npm run typecheck

      - run: npx electron-vite build

      - run: npx electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version="$VERSION"

      # Если бандл claude не долетел до .app, релиз бесполезен — лимиты и список моделей падают
      # как в 0.2.109. Проваливаем сборку, чтобы не публиковать такой релиз.
      - if: matrix.platform == 'mac'
        run: |
          set -eu
          test -x dist/mac-arm64/Atox.app/Contents/Resources/claude-cli/claude
          test -x dist/mac/Atox.app/Contents/Resources/claude-cli/claude
      - if: matrix.platform == 'linux'
        run: test -x dist/linux-unpacked/resources/claude-cli/claude

      - name: Sign update manifest
        run: npm run release:manifest -- dist "$VERSION" ${{ matrix.platform }}
        env:
          ATOX_UPDATE_SIGNING_KEY: ${{ secrets.ATOX_UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        working-directory: release
        run: |
          gh release create "v$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "Atox $VERSION" \
            --notes "$(git -C .. log -1 --format=%s)" \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
