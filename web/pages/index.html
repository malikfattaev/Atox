<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atox</title>
    <meta
      name="description"
      content="Atox is a lightweight Mac app for Claude Code, Codex and any CLI agent. Projects, chats and real terminals in one window."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Atox — every coding agent in one window" />
    <meta property="og:description" content="A lightweight Mac app for Claude Code, Codex and any CLI agent." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atox.dev/" />
    <meta property="og:image" content="https://atox.dev/screenshot.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/styles.css" />

  <body>
    <!-- header -->
    <main class="page">
      <section class="hero">
        <h1>Every coding agent in one window</h1>
        <p class="hero__lead">A lightweight Mac app for Claude Code, Codex and any CLI agent.</p>
      </section>

      <section class="download">
        <a class="button button--primary" href="/download/arm64" data-download="primary">
          Download Atox for Mac
        </a>
        <a class="button button--link" href="/download/x64" data-download="alternate">Intel Mac</a>
        <p class="download__meta" data-release-meta>Free · macOS · Apple Silicon and Intel</p>
      </section>

      <figure class="shot">
        <img
          src="/screenshot.png"
          alt="Atox: a Claude Code chat that started a Codex worker, shown under it in the sidebar"

        />
