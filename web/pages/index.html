<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Atox — one calm place to run Claude, Codex and any other agent together" />
    <meta property="og:description" content="Orchestrate agents across models, watch them work, ship via PRs. Nothing extra." />

    <!-- header -->

      <figure class="shot">
        <img
